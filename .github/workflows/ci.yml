name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobmatch
          POSTGRES_PASSWORD: jobmatch_test
          POSTGRES_DB: jobmatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobmatch -d jobmatch_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - name: Test SQLite
        if: matrix.database == 'sqlite'
        run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: Test PostgreSQL
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jobmatch:jobmatch_test@localhost:5432/jobmatch_test
        run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=95
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 120
      - run: python3 demo.py
      - if: always()
        run: docker compose logs && docker compose down -v
